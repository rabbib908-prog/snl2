<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SNL Chats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>SNL Chats</title>
<style>
:root{--p:#1565d8;--on:#fff;--bg:#f2f6fc;--chat:#e8f0fb;--out:#d4e6ff;--in:#fff;--text:#13203a;--muted:#6b7a90;--line:#e2e9f3;--surf:#fff;--tick:#1e88ff;--red:#e53935;--r:14px;--anim:pop}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;display:flex;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .4s}
button{font:inherit;cursor:pointer;border:0;transition:transform .12s,background .2s}
button:active{transform:scale(.92)}
input{font:inherit;color:var(--text);outline:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.scr,#app{width:100%;max-width:480px;height:100%;background:var(--surf);position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.1)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.4,0,.2,1);background:var(--surf)}
#chat{transform:translateX(100%);background:var(--chat)}
#app.open #chat{transform:none}#app.open #list{transform:translateX(-28%)}
.av{display:inline-grid;border-radius:50%;overflow:hidden;background:rgba(127,127,127,.13);flex-shrink:0}.av svg{width:100%;height:100%}
header{background:var(--p);color:var(--on);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;transition:background .4s}
header h1{font-size:20px;flex:1}header h1 span{opacity:.7;font-weight:400}
.ib{background:none;color:inherit;padding:7px;border-radius:50%;display:inline-grid;place-items:center}.ib:active{background:rgba(127,127,127,.25)}
.hn{flex:1;min-width:0;line-height:1.2}.hn b{display:block}.hn small{opacity:.85;font-size:12px}
/* auth */
#auth{display:grid;place-items:center;padding:20px;overflow-y:auto}
.ac{width:100%;display:flex;flex-direction:column;gap:10px}
.hero{align-self:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.ac h1{text-align:center;font-size:30px;color:var(--p)}.ac h1 span{color:var(--muted);font-weight:400}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:3px}.tabs button{flex:1;padding:9px;border-radius:10px;background:none;color:var(--muted)}.tabs .on{background:var(--surf);color:var(--p);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.ac input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.ac input:focus{border-color:var(--p)}
#pk{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:left;color:var(--text)}
#pk span{flex:1}.ch{width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .25s}.open .ch{transform:rotate(-135deg)}
#al{max-height:0;overflow:hidden;transition:max-height .35s;border-radius:12px;background:var(--surf)}
.open #al{max-height:420px;overflow-y:auto;border:1px solid var(--line);margin-top:6px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.opt:active{background:var(--bg)}
.opt small{color:var(--muted);margin-left:auto}
#er{min-height:20px;color:var(--red);font-size:14px;text-align:center}#er.ok{color:#2e7d32}
.lnk{background:none;color:var(--p);padding:6px;font-size:14px;align-self:center}
.go{width:100%;padding:14px;border-radius:12px;background:var(--p);color:var(--on);font-weight:600;font-size:16px}
/* list */
.search{padding:8px 12px;border-bottom:1px solid var(--line)}.search input{width:100%;padding:9px 14px;border-radius:20px;border:0;background:var(--bg)}
#rows{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:12px 14px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;animation:pop .3s both}.row:active{background:var(--bg)}
.mid{flex:1;min-width:0}.top,.prev{display:flex;justify-content:space-between;gap:8px}.name{font-weight:600}.name small{color:var(--muted);font-weight:400}.time{font-size:12px;color:var(--muted)}
.prev{color:var(--muted);font-size:14px}.prev p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--p);color:var(--on);border-radius:10px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-weight:600}
.note{color:var(--muted);font-size:14px;margin:8px 0 12px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.fab{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--p);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
/* chat */
#msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
body[data-k=cow] #msgs{background-image:radial-gradient(ellipse 60px 40px at 15% 20%,#0002 98%,#0000),radial-gradient(ellipse 80px 50px at 80% 45%,#0002 98%,#0000),radial-gradient(ellipse 50px 70px at 30% 80%,#0002 98%,#0000);background-attachment:local}
.day{align-self:center;background:var(--surf);color:var(--muted);font-size:12px;padding:3px 12px;border-radius:10px;margin:6px 0}
.m{max-width:80%;padding:6px 9px 4px;border-radius:var(--r);background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.1);word-wrap:break-word;cursor:pointer;animation:var(--anim) .4s}
.m.me{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}.m.them{align-self:flex-start;border-bottom-left-radius:4px}
.m.del{opacity:.6;font-style:italic;color:var(--muted)}
.t{font-size:11px;color:var(--muted);display:flex;gap:3px;justify-content:flex-end}.tk{display:inline-flex}.tk .i{width:16px;height:16px;stroke-width:2.2}.tk.read{color:var(--tick)}
.q{border-left:3px solid var(--p);background:rgba(127,127,127,.12);border-radius:6px;padding:3px 8px;margin-bottom:4px;font-size:13px}.q b{display:block;color:var(--p);font-size:12px}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pic{display:block;max-width:100%;min-width:140px;min-height:100px;max-height:260px;border-radius:10px;margin-bottom:3px;background:rgba(127,127,127,.2)}
.file{display:flex;align-items:center;gap:10px;min-width:200px;padding:4px 2px}.fi{width:40px;height:44px;border-radius:8px;background:var(--p);color:var(--on);display:grid;place-items:center;font-size:11px;font-weight:700}.file b{display:block;font-size:14px;word-break:break-all}.file small{color:var(--muted)}
.vn{display:flex;align-items:center;gap:8px;min-width:220px}.pl{width:36px;height:36px;border-radius:50%;background:var(--p);color:var(--on);display:grid;place-items:center}.pl .i{width:16px;height:16px}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:30px}.wv i{flex:1;background:var(--muted);opacity:.45;border-radius:2px;min-height:3px}.wv i.on{background:var(--p);opacity:1}.du{font-size:12px;color:var(--muted);min-width:34px}
#rp{background:var(--surf);padding:0 10px;max-height:0;overflow:hidden;transition:.22s;display:flex;align-items:center;gap:8px}#rp.show{max-height:60px;padding:8px 10px}#rp .q{flex:1;min-width:0;margin:0}
.bar{display:flex;gap:6px;padding:8px;background:var(--surf);border-top:1px solid var(--line);align-items:center}.bar .ib{color:var(--muted)}.bar .ib .i{width:22px;height:22px}
.bar input{flex:1;min-width:0;padding:11px 16px;border-radius:22px;border:0;background:var(--bg)}
.send,.mic{width:44px;height:44px;border-radius:50%;background:var(--p);color:var(--on);display:grid;place-items:center;flex-shrink:0}
.bar .send{display:none}.bar.has .send{display:grid}.bar.has .mic{display:none}
.recui{display:none;flex:1;align-items:center;gap:10px}.bar.rec>*:not(.recui){display:none}.bar.rec .recui{display:flex}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
#rt{flex:1;color:var(--red);font-weight:600}.cancel{background:none;color:var(--muted);padding:8px}
/* sheet, lightbox, toast */
#sheet{position:absolute;inset:0;z-index:10;pointer-events:none}#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow-y:auto;background:var(--surf);border-radius:20px 20px 0 0;padding:16px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#sheet.show{pointer-events:auto}#sheet.show .bk{opacity:1}#sheet.show .pane{transform:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:center}.grid button,.act{background:var(--bg);color:var(--text);border-radius:14px;padding:14px 4px}
.grid button .i{width:26px;height:26px;color:var(--p);display:block;margin:0 auto 4px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:6px}.act.red{color:var(--red)}
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:8px 0}
#lb{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}#lb.show{opacity:1;pointer-events:auto}#lb img{max-width:96%;max-height:90%}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#13203a;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30}#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes bounce{0%{transform:translateY(20px) scale(.8);opacity:0}60%{transform:translateY(-6px)}}
@keyframes float{from{transform:translateY(14px);opacity:0}}
@keyframes snap{0%{transform:scaleX(.4);opacity:0}60%{transform:scaleX(1.08)}}
@keyframes thud{0%{transform:translateY(-30px);opacity:0}60%{transform:none}72%{transform:translateX(-4px)}86%{transform:translateX(3px)}}
@keyframes scoot{from{transform:translateX(60px) skewX(-12deg);opacity:0}}
@keyframes ram{0%{transform:translateX(50px);opacity:0}70%{transform:translateX(-8px)}}
@keyframes swing{0%{transform:rotate(-8deg) translateY(-14px);opacity:0;transform-origin:top right}60%{transform:rotate(4deg)}}
</style>
</head>
<body>
<section class="scr" id="auth"><div class="ac">
  <div class="hero" id="hero"></div>
  <h1>SNL <span>Chats</span></h1>

  <div id="upf" hidden style="display:flex;flex-direction:column;gap:10px">

    <div id="pick"><button type="button" id="pk"><span id="pkv">আপনার পশু বেছে নিন</span><i class="ch"></i></button><div id="al"></div></div>
    <input id="cu" placeholder="পশুর নাম লিখুন (বাঘ, owl, ইলিশ…)" maxlength="30" hidden>
  </div>
  <input id="em" type="email" placeholder="ইমেইল" autocomplete="email">
  <input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password" hidden>
  <input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="ইমেইলে আসা কোড" hidden style="text-align:center;letter-spacing:6px;font-size:20px">
  <p id="er"></p>
  <button class="go" id="go">কোড পাঠান</button>
  <button type="button" class="lnk" id="vm"></button>
</div></section>
<div id="app" hidden>
  <section class="screen" id="list">
    <header><span id="me"></span><h1>SNL <span>Chats</span></h1><button class="ib" id="bell" aria-label="নোটিফিকেশন ও ইনস্টল"></button><button class="ib" id="out" aria-label="লগআউট"></button></header>
    <div class="search"><input id="q" placeholder="চ্যাট খুঁজুন" autocomplete="off"></div>
    <div id="rows"></div>
    <button class="fab" id="newc" aria-label="নতুন চ্যাট"></button>
  </section>
  <section class="screen" id="chat">
    <header><button class="ib" id="back" aria-label="ফিরে যান"></button><span id="cav"></span><div class="hn"><b id="cn"></b><small id="cs"></small></div></header>
    <div id="msgs"></div>
    <div id="rp"><div class="q"><b id="rpn"></b><span id="rpt"></span></div><button class="ib" id="rpx" aria-label="বাতিল"></button></div>
    <div class="bar" id="bar">
      <button class="ib" id="att" aria-label="ফাইল"></button>
      <input id="in" placeholder="মেসেজ লিখুন" autocomplete="off">
      <button class="mic" id="mic" aria-label="ভয়েস নোট"></button>
      <button class="send" id="send" aria-label="পাঠান"></button>
      <div class="recui"><button class="cancel" id="rc">বাতিল</button><span class="dot"></span><span id="rt">0:00</span><button class="send" style="display:grid" id="rs" aria-label="ভয়েস পাঠান"></button></div>
    </div>
  </section>
  <div id="sheet"><div class="bk"></div><div class="pane"></div></div>
  <div id="lb"><img alt=""></div>
</div>
<div id="toast"></div>
<input type="file" id="fph" accept="image/*" hidden><input type="file" id="fdoc" hidden>

async function loadChats(){

  sb.from('messages').select('id,chat_id,sender_id,kind,body,file_name,duration,deleted,created_at').in('chat_id',ids).order('created_at',{ascending:false}).limit(300)]);

async function open(id){
 cur=CH.find(c=>c.id===id)||{id,who:null};msgs=new Map();rp=null;$('#rp').classList.remove('show');
 $('#cn').textContent=nm();$('#cs').textContent=cur.who?cur.who.animal:'';$('#cav').innerHTML=cur.who?av(cur.who.animal,38):'';$('#msgs').innerHTML='';$('#app').classList.add('open');
 const{data}=await sb.from('messages').select('*').eq('chat_id',id).order('created_at',{ascending:true}).limit(300);
 (data||[]).forEach(m=>msgs.set(m.id,m));draw();markRead()}
function close(){stopAud();$('#app').classList.remove('open');cur=null;loadChats()}$('#back').onclick=close;
function markRead(){if(!cur)return;sb.from('chat_members').update({last_read_at:new Date().toISOString()}).eq('chat_id',cur.id).eq('user_id',me.id).then(soonLoad)}
function rt(){sb.channel('rt')
 .on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{const m=p.new;if(!m||!m.id)return;
  if(cur&&m.chat_id===cur.id){const had=msgs.has(m.id);msgs.set(m.id,m);if(had){const e=$(`[data-mid="${m.id}"]`);if(e){e.outerHTML=bub(m);hydrate($('#msgs'))}}else add(m);if(m.sender_id!==me.id)markRead()}soonLoad()})
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_members'},p=>{if(cur&&p.new.chat_id===cur.id&&p.new.user_id!==me.id){cur.theirRead=p.new.last_read_at;ticks()}})
 .subscribe()}
async function send(row){if(!cur)return;
 const{data,error}=await sb.from('messages').insert({chat_id:cur.id,reply_to:rp?rp.id:null,...row}).select().single();
 if(error)return toast('পাঠানো যায়নি');cancelRp();if(!msgs.has(data.id)){msgs.set(data.id,data);add(data)}soonLoad()}
function sendText(){const v=$('#in').value.trim();if(!v)return;$('#in').value='';$('#bar').classList.remove('has');send({kind:'text',body:v})}
$('#send').onclick=sendText;$('#in').onkeydown=e=>{if(e.key==='Enter')sendText()};$('#in').oninput=e=>$('#bar').classList.toggle('has',!!e.target.value.trim());
function cancelRp(){rp=null;$('#rp').classList.remove('show')}$('#rpx').onclick=cancelRp;
/* files */
async function shrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(x=>r(x&&x.size<f.size?new File([x],f.name.replace(/\.\w+$/,'.jpg'),{type:'image/jpeg'}):f),'image/jpeg',.82))}catch(e){return f}}
async function upload(blob,name,type){const ext=((name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin').slice(0,8),path=`${cur.id}/${crypto.randomUUID()}.${ext}`;
 const{error}=await sb.storage.from('chat-files').upload(path,blob,{contentType:type||'application/octet-stream'});if(error){toast('আপলোড ব্যর্থ হয়েছে');return null}return path}
async function pick(f){if(!f||!cur)return;if(f.size>25*1048576)return toast('ফাইল ২৫ MB এর বেশি হতে পারবে না');toast('আপলোড হচ্ছে…');
 const isImg=f.type.startsWith('image/');if(isImg)f=await shrink(f);const path=await upload(f,f.name,f.type);if(path)send({kind:isImg?'image':'file',file_path:path,file_name:f.name,file_size:f.size})}
for(const id of['fph','fdoc'])$('#'+id).onchange=e=>{pick(e.target.files[0]);e.target.value=''};
$('#att').onclick=()=>sheet(`<div class="grid"><button data-k="fph">${ic('image')}ছবি</button><button data-k="fdoc">${ic('file')}ডকুমেন্ট</button></div>`);
/* voice */
async function startRec(){
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('এই ব্রাউজারে ভয়েস রেকর্ড চলবে না');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(st).connect(an);
  const mr=new MediaRecorder(st),ch=[],lv=[],buf=new Uint8Array(an.fftSize),t0=Date.now();mr.ondataavailable=e=>ch.push(e.data);mr.start();
  const iv=setInterval(()=>{an.getByteTimeDomainData(buf);let x=0;for(const v of buf)x=Math.max(x,Math.abs(v-128));lv.push(x/128);$('#rt').textContent=fmt((Date.now()-t0)/1000)},100);
  rec={mr,st,ac,ch,lv,iv,t0};$('#bar').classList.add('rec')}catch(e){toast('মাইক্রোফোনের অনুমতি দিন')}}
function stopRec(go){if(!rec)return;const r=rec;rec=null;clearInterval(r.iv);$('#bar').classList.remove('rec');
 r.mr.onstop=async()=>{r.st.getTracks().forEach(t=>t.stop());r.ac.close();if(!go)return;
  const dur=(Date.now()-r.t0)/1000;if(dur<.8)return toast('আরেকটু সময় ধরে বলুন');
  const n=32,mx=Math.max(.05,...r.lv),wave=[];for(let i=0;i<n;i++){const a=r.lv.slice(Math.floor(i*r.lv.length/n),Math.floor((i+1)*r.lv.length/n)+1);wave.push(Math.max(.12,Math.max(0,...a)/mx))}
  const type=(r.mr.mimeType||'audio/webm').split(';')[0],path=await upload(new Blob(r.ch,{type}),'v.'+(type.includes('mp4')?'m4a':'webm'),type);
  if(path)send({kind:'voice',file_path:path,duration:dur,wave})};r.mr.stop()}
$('#mic').onclick=startRec;$('#rs').onclick=()=>stopRec(1);$('#rc').onclick=()=>stopRec(0);
function stopAud(){if(aud){aud.pause();aud=null}if(aid){const e=$(`[data-mid="${aid}"]`),m=msgs.get(aid);if(e&&m)resetV(e,m);aid=null}}
function resetV(e,m){e.querySelector('.pl').innerHTML=ic('play');e.querySelectorAll('.wv i').forEach(i=>i.classList.remove('on'));e.querySelector('.du').textContent=fmt(m.duration||0)}
async function play(id){const m=msgs.get(+id);if(aid==m.id)return stopAud();stopAud();const u=await url(m.file_path);if(!u)return toast('অডিও পাওয়া যায়নি');
 const e=$(`[data-mid="${m.id}"]`),bars=e.querySelectorAll('.wv i');aud=new Audio(u);aid=m.id;e.querySelector('.pl').innerHTML=ic('pause');
 aud.ontimeupdate=()=>{const d=isFinite(aud.duration)?aud.duration:m.duration,p=aud.currentTime/d;bars.forEach((b,i)=>b.classList.toggle('on',i<p*bars.length));e.querySelector('.du').textContent=fmt(aud.currentTime)};
 aud.onended=()=>{resetV(e,m);aud=null;aid=null};aud.play().catch(()=>{toast('চালানো যায়নি');stopAud()})}
/* message actions */
$('#msgs').onclick=async e=>{
 const p=e.target.closest('.pl');if(p)return play(p.dataset.id);
 const im=e.target.closest('.pic');if(im&&im.src){$('#lb img').src=im.src;return $('#lb').classList.add('show')}
 const f=e.target.closest('.file');if(f){const u=await url(f.dataset.path);return u&&window.open(u,'_blank')}
 const b=e.target.closest('.m');if(!b)return;const m=msgs.get(+b.dataset.mid);if(!m||m.deleted)return;
 sheet(`<button class="act" data-a="reply" data-id="${m.id}">${ic('reply')}রিপ্লাই</button>${m.sender_id===me.id?`<button class="act red" data-a="del" data-id="${m.id}">${ic('trash')}সবার জন্য মুছুন</button>`:''}`)};
$('#lb').onclick=()=>$('#lb').classList.remove('show');
$('#sheet').onclick=async e=>{
 if(e.target.classList.contains('bk'))return sheet(null);
 const k=e.target.closest('[data-k]');if(k){sheet(null);return $('#'+k.dataset.k).click()}
 const pp=e.target.closest('[data-p]');if(pp){sheet(null);return push(pp.dataset.p)}
 const a=e.target.closest('[data-a]');if(!a)return;const m=msgs.get(+a.dataset.id);sheet(null);
 if(a.dataset.a==='reply'){rp={id:m.id};$('#rpn').textContent=m.sender_id===me.id?'আপনি':nm();$('#rpt').textContent=pv(m);$('#rp').classList.add('show');$('#in').focus()}
 if(a.dataset.a==='del'){const{error}=await sb.from('messages').update({deleted:true,body:null}).eq('id',m.id);if(error)toast('মোছা যায়নি')}};
viaUI();hero();
</script>
</body>
</html>
